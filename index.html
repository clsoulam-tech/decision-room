<script type="module">const coreModule=(()=>{
const DAY=86400000;
const SKILL_NAMES=['翻前開池','翻前防守','賠率與詐唬','翻牌範圍','小注與加注防守','轉牌與極化','河牌決策','試探下注與數據'];
function thresholds(p,b) {
  if(!(Number.isFinite(p)&&p>0&&Number.isFinite(b)&&b>0)) throw RangeError('Positive pot and bet required');
  return {call:b/(p+2*b),bluff:b/(p+b),mdf:p/(p+b)};
}
const equity=(w,t,n)=>(w+t/2)/n;
const bluffEV=(p,b,f)=>p*f-b*(1-f);
function numberAnswer(input,correct) {
  if(typeof input!=='string'||!/^\s*[+-]?\d+(?:\.\d+)?\s*%?\s*$/.test(input)) return false;
  return Math.abs(Number(input.trim().replace('%',''))-correct)<=1+1e-9;
}
function nextReview(previous,correct,now) {
  const stage=correct?(previous?.stage??-1)+1:0;
  return {stage,due:now+([1,3,7,14,30][stage]??45)*DAY};
}
function plan(questions, attempts, reviews, count, now=Date.now(), skill='', currentSkill='') {
  const pool=questions.filter(q=>!skill||String(q.skill)===String(skill));
  const seen=new Set(attempts.map(a=>a.id)); const stats=new Map();
  const recent=attempts.slice(-80);
  for(const a of recent){
    const s=stats.get(a.skill)||[0,0];s[0]++;s[1]+=Number(!a.correct);stats.set(a.skill,s);
  }
  const weak=q=>{const [n,w]=stats.get(q.skill)||[0,0];return n>=3?w/n:0};
  const due=pool.filter(q=>reviews[q.id]?.due<=now).sort((a,b)=>reviews[a.id].due-reviews[b.id].due);
  const active=pool.filter(q=>!reviews[q.id]||reviews[q.id].due<=now);
  const weaknesses=active.filter(q=>!due.includes(q)&&weak(q)>=.35).sort((a,b)=>weak(b)-weak(a));
  const chapter=active.filter(q=>!q.variant).sort((a,b)=>Number(String(b.skill)===String(currentSkill))-Number(String(a.skill)===String(currentSkill))||Number(seen.has(a.id))-Number(seen.has(b.id)));
  const variants=active.filter(q=>!seen.has(q.id)&&q.variant);
  const chosen=[];const ids=new Set();
  const take=(list,n,why)=>{let got=0;for(const q of list){if(got>=n||chosen.length>=count)break;if(ids.has(q.id))continue;ids.add(q.id);chosen.push({id:q.id,why});got++}};
  take(due,Math.round(count*.6),'已到期錯題');take(weaknesses,Math.max(0,Math.round(count*.6)-chosen.length),'近期弱項');
  take(chapter,Math.round(count*.25),'課程題');take(variants,Math.round(count*.15),'未見變體');
  take([...due,...weaknesses,...chapter,...variants,...active],count,'補足本節練習');
  return chosen;
}
function examGrade(attempts, skillOrder) {
  const bySkill=Object.fromEntries(skillOrder.map(s=>[s,{correct:0,total:0}]));
  for(const a of attempts){if(!Object.hasOwn(bySkill,a.skill))continue;bySkill[a.skill].total++;bySkill[a.skill].correct+=Number(a.correct);}
  const total=attempts.length, correct=attempts.reduce((s,a)=>s+Number(a.correct),0);
  const full=total===40&&skillOrder.length===8&&skillOrder.every(s=>bySkill[s].total===5);
  return {bySkill,total,correct,full,passed:full&&correct>=32&&skillOrder.every((s,i)=>bySkill[s].correct>=(i<2?4:3))};
}
function makeState(){return {version:1,profile:'ted',studyMinutes:15,attempts:[],reviews:{},exams:{},notes:{},practice:null,hands:[],batches:[]};}
function validateBackup(b){
  const plain=x=>x&&typeof x==='object'&&!Array.isArray(x)&&Object.getPrototypeOf(x)===Object.prototype;
  const safeKey=x=>typeof x==='string'&&/^[a-z0-9:_./ -]{1,160}$/i.test(x)&&!['__proto__','constructor','prototype'].includes(x);
  if(!plain(b)||b.version!==1||!['ted','guest'].includes(b.profile))throw Error('備份版本不受支援');
  if(![3,15,60].includes(b.studyMinutes)||!Array.isArray(b.attempts)||!Array.isArray(b.hands)||!Array.isArray(b.batches)||!plain(b.exams)||!plain(b.notes)||!plain(b.reviews))throw Error('備份結構不完整');
  if(!b.attempts.every(x=>plain(x)&&safeKey(x.id)&&typeof x.correct==='boolean'&&Number.isFinite(x.at)))throw Error('備份作答格式不正確');
  if(!Object.entries(b.notes).every(([k,v])=>safeKey(k)&&typeof v==='string'&&v.length<=3000))throw Error('備份筆記格式不正確');
  if(!Object.entries(b.reviews).every(([k,v])=>safeKey(k)&&plain(v)&&Number.isFinite(v.due)&&Number.isInteger(v.stage)))throw Error('備份複習格式不正確');
  // Validate replay data as stored, without inferring that incomplete legacy histories are gradable.
  const count=n=>Number.isSafeInteger(n)&&n>=0;
  const stringList=x=>Array.isArray(x)&&x.every(s=>typeof s==='string');
  const amount=n=>Number.isSafeInteger(n);
  const street=s=>['preflop','flop','turn','river'].includes(s);
  const action=x=>plain(x)&&typeof x.kind==='string'&&amount(x.amount)&&amount(x.to);
  const validHand=x=>plain(x)&&safeKey(x.id)&&x.site==='GG'&&plain(x.stakes)&&count(x.stakes.bb)&&x.stakes.bb>0&&count(x.stakes.sb)&&x.stakes.sb>0&&x.stakes.sb<=x.stakes.bb&&
   ['verified','review'].includes(x.status)&&typeof x.raw==='string'&&stringList(x.cards)&&stringList(x.board)&&
   Array.isArray(x.seats)&&x.seats.every(s=>plain(s)&&safeKey(s.position)&&amount(s.stack))&&
   Array.isArray(x.actions)&&x.actions.every(a=>action(a)&&street(a.street)&&safeKey(a.position)&&typeof a.allIn==='boolean'&&amount(a.potBefore)&&amount(a.potAfter))&&
   Array.isArray(x.decisions)&&x.decisions.every(d=>plain(d)&&count(d.index)&&d.index<x.actions.length&&street(d.street)&&safeKey(d.position)&&stringList(d.board)&&
    [d.pot,d.toCall,d.stack,d.effectiveStack].every(amount)&&count(d.activeCount)&&count(d.aggressiveActionsPreflop)&&(d.flopCount===null||count(d.flopCount))&&typeof d.eligible==='boolean'&&action(d.actual))&&
   (x.summary==null||(plain(x.summary)&&(x.summary.pot===null||amount(x.summary.pot))));
  if(!b.hands.every(validHand))throw Error('備份牌譜格式不正確');
  const validBatch=x=>plain(x)&&typeof x.label==='string'&&[x.added,x.duplicates,x.conflicts,x.errors].every(count)&&
    (x.keys===undefined||stringList(x.keys)&&x.keys.every(safeKey))&&(x.files===undefined||stringList(x.files))&&
    (x.conflictCandidates===undefined||Array.isArray(x.conflictCandidates)&&x.conflictCandidates.every(validHand));
  if(!b.batches.every(validBatch))throw Error('備份匯入格式不正確');
  if(b.flags!==undefined&&(!plain(b.flags)||!Object.entries(b.flags).every(([k,v])=>safeKey(k)&&plain(v)&&Number.isFinite(v.at)&&Number.isInteger(v.version))))throw Error('備份題目標記格式不正確');
  const question=q=>plain(q)&&safeKey(q.id)&&safeKey(q.familyId)&&typeof q.skill==='string'&&typeof q.prompt==='string'&&typeof q.explanation==='string'&&Array.isArray(q.choices)&&q.choices.length>=2&&q.choices.every(c=>plain(c)&&safeKey(c.id)&&typeof c.text==='string')&&q.choices.some(c=>c.id===q.answer);
  const validExam=e=>plain(e)&&Array.isArray(e.items)&&e.items.length===40&&e.items.every(question)&&Array.isArray(e.attempts)&&Number.isInteger(e.index)&&e.index===e.attempts.length&&e.index>=0&&e.index<=40&&(e.index===40?Number.isFinite(e.finished)&&e.finished>0:e.finished===undefined||e.finished===null||e.finished===false)&&e.attempts.every((a,i)=>plain(a)&&a.id===e.items[i].id&&a.skill===e.items[i].skill&&e.items[i].choices.some(c=>c.id===a.choice)&&a.correct===(e.items[i].answer===a.choice));
  if(!Object.keys(b.exams).every(k=>['mock-a','mock-b'].includes(k)&&validExam(b.exams[k])))throw Error('備份盲測格式不正確');
  if(b.practice!==null&&(!plain(b.practice)||!Array.isArray(b.practice.items)||!Number.isInteger(b.practice.index)||b.practice.index<0||b.practice.index>b.practice.items.length||!b.practice.items.every(x=>plain(x)&&safeKey(x.id))||(b.practice.feedback!=null&&(!plain(b.practice.feedback)||b.practice.feedback.id!==b.practice.items[b.practice.index]?.id||typeof b.practice.feedback.correct!=='boolean'||typeof b.practice.feedback.choice!=='string'))))throw Error('備份練習格式不正確');
  return {...makeState(),...b};
}

function backupCounts(state){
 return {
  hands:state.hands.length, notes:Object.keys(state.notes).length, attempts:state.attempts.length,
  lessons:Object.values(state.course?.records??{}).filter(r=>r.passedAt).length, exams:Object.keys(state.exams).length
 };
}
function restoreSummary(current,incoming){
 const before=backupCounts(current), after=backupCounts(incoming);
 const rows=Object.entries({hands:'手牌',notes:'筆記',attempts:'評分作答',lessons:'已完成核心課',exams:'盲測紀錄'});
 return ['確認以備份取代本機資料？','目前 → 備份',...rows.map(([k,l])=>l+'：'+before[k]+' → '+after[k]),'原有資料不會合併；如要保留，請先取消並下載本機備份。'].join('\n');
}

return {DAY,SKILL_NAMES,thresholds,equity,bluffEV,numberAnswer,nextReview,plan,examGrade,makeState,validateBackup,backupCounts,restoreSummary};

const parserModule=(()=>{
// Browser-safe, local-only parser for English GGPoker Hold'em No Limit TXT.
const M = '\\$((?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)(?:\\.[0-9]{1,2})?)';
const header = new RegExp(`^Poker Hand #([A-Za-z0-9_-]+): Hold'em No Limit \\(${M}/${M}\\) - (\\d{4})/(\\d{2})/(\\d{2}) (\\d{2}:\\d{2}:\\d{2})$`);
const post = new RegExp(`^posts (small blind|big blind|ante|straddle) ${M}$`);
const direct = new RegExp(`^(calls|bets) ${M}( and is all-in)?$`);
const raise = new RegExp(`^raises ${M} to ${M}( and is all-in)?$`);
const refund = new RegExp(`^Uncalled bet \\(${M}\\) returned to (.+)$`);
const collect = new RegExp(`^(.+) collected ${M} from pot$`);
const cardList = s => (s.match(/\[[^\]]*\]/g) || []).flatMap(g => g.slice(1,-1).trim().split(/\s+/).filter(Boolean));
const validCards = (cards, n) => cards.length===n && cards.every(c=>/^[2-9TJQKA][cdhs]$/.test(c)) && new Set(cards).size===n;
const cents = s => {
  if (!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(s)) throw new Error('invalid-money');
  const [whole, frac=''] = s.replaceAll(',','').split('.');
  const value = Number(whole) * 100 + Number(frac.padEnd(2, '0'));
  if (!Number.isSafeInteger(value)) throw new Error('money-out-of-range');
  return value;
};
const format = s => s.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n').map(l=>l.trimEnd()).join('\n').trim();
const positions = {2:['BTN','BB'],3:['BTN','SB','BB'],4:['BTN','SB','BB','CO'],5:['BTN','SB','BB','UTG','CO'],6:['BTN','SB','BB','UTG','HJ','CO']};
const sname = {FLOP:'flop',TURN:'turn',RIVER:'river'};

function parseHand(raw) {
  const lines=raw.split('\n');
  const h=lines[0].match(header);
  if(!h) throw new Error(/^Poker Hand #\S+: Omaha\b/.test(lines[0])?'unsupported-omaha':'unsupported-header');
  const [,id,sb0,bb0,y,mo,d,t]=h;
  const stakes={sb:cents(sb0),bb:cents(bb0)};
  if(stakes.sb<=0 || stakes.bb<stakes.sb) throw new Error('invalid-stakes');
  const datetime=`${y}-${mo}-${d}T${t}`;
  if(!Number.isFinite(Date.parse(datetime+'Z')) || new Date(datetime+'Z').toISOString().slice(0,19)!==datetime) throw new Error('invalid-date');
  const m=lines[1]?.match(/^Table '(.*)' (\d+)-max Seat #(\d+) is the button$/);
  if(!m) throw new Error('unsupported-table');
  const [,table,max,button0]=m, button=Number(button0);
  let seats=[],hero=null,cards=[],board=[],street='preflop',summary=false,flopCount=null,aggressiveActionsPreflop=0;
  const flags=new Set(), shown=new Map(), actions=[],decisions=[], variants={}, state=new Map();
  let pot=0,target=0,blinds={sb:0,bb:0},expectedPot=null,rake=null,jackpot=null,other=null,winnings=0;
  for(const line of lines.slice(2)){
    const seat=line.match(/^Seat (\d+): (.*) \(\$((?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?) in chips\)$/);
    if (!seat) break;
    const n=Number(seat[1]), stack=cents(seat[3]),player=seat[2];
    if (seats.some(s=>s.seat===n || s.player===player)) flags.add('duplicate-seat');
    seats.push({seat:n,player,stack,position:null});
  }
  seats.sort((a,b)=>a.seat-b.seat);
  const btnIdx=seats.findIndex(s=>s.seat===button), labels=positions[seats.length];
  if(!labels || btnIdx<0 || Number(max)!==6) flags.add('positions-unverified');
  for(let i=0;i<seats.length;i++){
    const s=seats[i];
    s.position=labels&&btnIdx>=0?labels[(i-btnIdx+seats.length)%seats.length]:`Seat ${s.seat}`;
    state.set(s.player,{...s,remaining:s.stack,paid:0,folded:false,allIn:false});
  }
  const resetStreet=()=>{for(const s of state.values())s.paid=0;target=0};
  const pfLive=()=>[...state.values()].filter(s=>!s.folded);
  function transact(s,kind,amount,to,allIn=false) {
    const before=pot;
    if(kind==='return') {
      if(amount>s.paid || amount>pot) flags.add('invalid-refund');
      s.paid-=amount;s.remaining+=amount;pot-=amount;
    } else if(kind==='fold') s.folded=true;
    else if(amount) {
      if(s.remaining<amount || s.allIn) flags.add('invalid-stack');
      s.remaining-=amount;
      if(kind!=='ante')s.paid+=amount;
      pot+=amount;
      target=Math.max(target,s.paid);
      s.allIn ||= allIn || s.remaining===0;
      if(allIn && s.remaining!==0) flags.add('all-in-stack-mismatch');
    }
    actions.push({street,position:s.position,kind,amount,to,allIn,potBefore:before,potAfter:pot});
  }
  for(const line of lines.slice(2+seats.length)) {
    if(!line)continue;
    if(line==='*** SUMMARY ***'){summary=true;continue}
    if(summary) {
      const amounts=line.startsWith('Total pot ') && [...line.matchAll(/(?:Total pot|Rake|Jackpot|Bingo|Fortune|Tax) \$((?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d{1,2})?)/g)].map(a=>cents(a[1]));
      if(amounts && amounts.length>=3){[expectedPot,rake,jackpot]=amounts; other=amounts.slice(3).reduce((a,b)=>a+b,0)}
      if(line.startsWith('Board ') && cardList(line).join(' ')!==board.join(' '))flags.add('board-summary-mismatch');
      continue;
    }
    if(line==='*** HOLE CARDS ***') continue;
    if(line.startsWith('Dealt to ')) {
      const known=line.match(/^Dealt to (.+?) \[([^\]]+)\]$/);
      if(known){
        if(hero)flags.add('multiple-visible-hole-hands');
        hero=known[1];cards=known[2].split(/\s+/);
      }
      continue;
    }
    const next=line.match(/^\*\*\* (?:(FIRST|SECOND) )?(FLOP|TURN|RIVER) \*\*\*/);
    if(next) {
      const cc=cardList(line), toStreet=sname[next[2]], n={flop:3,turn:4,river:5}[toStreet];
      if(next[1]) {
        flags.add('multiple-runs');
        variants[next[1]]=cc;
        if(next[1]==='FIRST') board=cc;
        continue;
      }
      if(!validCards(cc,n) || board.some((c,i)=>c!==cc[i]) || {preflop:3,flop:4,turn:5,river:6}[street]!==n) flags.add('invalid-board-order');
      if(toStreet==='flop') flopCount=pfLive().length;
      street=toStreet;
      board=cc;
      resetStreet();
      continue;
    }
    if(/^\*\*\* (?:(?:FIRST|SECOND) )?SHOWDOWN \*\*\*$/.test(line) || /^Hand was run /.test(line)) continue;
    let q;
    if((q=line.match(refund))) {
      const s=state.get(q[2]);
      if(!s){flags.add('unknown-refund-player');continue}
      const returned=cents(q[1]);transact(s,'return',returned,s.paid-returned);
      continue;
    }
    if((q=line.match(collect))) {
      if(!state.has(q[1]))flags.add('unknown-winner');
      winnings+=cents(q[2]);continue;
    }
    if(/: total \$\d/.test(line)){flags.add('unverified-pot-adjustment');continue}
    const sep=line.indexOf(': ');
    if(sep<0){flags.add('unsupported-line');continue}
    const player=line.slice(0,sep), prose=line.slice(sep+2), s=state.get(player);
    if(!s){flags.add('unknown-actor');continue}
    if(/^shows \[/.test(prose)){shown.set(player,cardList(prose));continue}
    if(/^mucks\b/.test(prose))continue;
    if(/Cashout|Cash Out/i.test(prose)){flags.add('cashout');continue}
    if((q=prose.match(post))){
      const kind={'small blind':'sb','big blind':'bb',ante:'ante',straddle:'straddle'}[q[1]], amount=cents(q[2]);
      if(kind==='ante'||kind==='straddle')flags.add('ante-or-straddle');
      if(kind==='sb'||kind==='bb'){
        blinds[kind]++;
        if(amount!==stakes[kind] || s.position!==kind.toUpperCase() && !(seats.length===2&&kind==='sb'&&s.position==='BTN'))flags.add('blind-mismatch');
      }
      transact(s,kind,amount,kind==='ante'?0:s.paid+amount);continue;
    }
    let kind, amount=0, to=s.paid, allIn=false;
    const due=Math.max(0,target-s.paid);
    if(prose==='folds')kind='fold';
    else if (prose==='checks'){
      kind='check';
      if(due)flags.add('check-facing-bet');
    } else if((q=prose.match(direct))){
      kind=q[1]==='calls'?'call':'bet';amount=cents(q[2]);to+=amount;allIn=!!q[3];
      if(kind==='call' && (amount!==Math.min(due,s.remaining)||!due))flags.add('call-mismatch');
      if(kind==='bet' && (target!==0||amount===0))flags.add('invalid-bet');
    } else if((q=prose.match(raise))){
      kind='raise';to=cents(q[2]);amount=to-s.paid;allIn=!!q[3];
      if(amount<=0 || to<=target || (to-target!==cents(q[1])))flags.add('raise-mismatch');
    } else {flags.add('unsupported-action');continue}
    if(s.folded || s.allIn)flags.add('action-after-fold-or-all-in');
    const actual={kind,amount,to};
    if(player===hero) {
      const live=pfLive(), opponents=live.filter(o=>o.player!==player);
      // Facing an all-in, the already-invested amount is still available to match.
      const effectiveStack=Math.max(0,Math.min(s.remaining,Math.max(0,...opponents.map(o=>o.remaining+Math.max(0,o.paid-s.paid)))));
      decisions.push({index:actions.length,street,board:[...board],position:s.position,pot,toCall:Math.min(due,s.remaining),stack:s.remaining,effectiveStack,activeCount:live.length,flopCount,aggressiveActionsPreflop,actual,eligible:false});
    }
    if(street==='preflop'&&kind==='raise')aggressiveActionsPreflop++;
    transact(s,kind,amount,to,allIn);
  }
  if(!hero || !state.has(hero) || !validCards(cards,2))flags.add('hero-unverified');
  if(shown.has(hero) && shown.get(hero).slice().sort().join()!==cards.slice().sort().join())flags.add('hero-showdown-mismatch');
  if(new Set([...cards,...board]).size!==cards.length+board.length)flags.add('duplicate-card');
  const knownCards=new Set([...cards,...board]);
  for(const [player,cc] of shown) if(player!==hero) {
    if(!validCards(cc,2) || cc.some(c=>knownCards.has(c)))flags.add('duplicate-or-invalid-showdown-cards');
    for(const c of cc)knownCards.add(c);
  }
  if(blinds.sb!==1 || blinds.bb!==1)flags.add('missing-or-extra-blind');
  if(!summary || expectedPot===null || winnings===0)flags.add('incomplete');
  if(expectedPot!==null && expectedPot!==pot)flags.add('pot-mismatch');
  if(expectedPot!==null && winnings!==expectedPot-rake-jackpot-other)flags.add('settlement-mismatch');
  if([...state.values()].some(s=>s.allIn) && (flopCount>2 || pfLive().length>2))flags.add('possible-side-pot');
  const status=flags.size?'review':'verified';
  for(const decision of decisions) {
    decision.eligible=status==='verified'&&(decision.street==='preflop'||decision.flopCount===2)&&decision.activeCount>=2;
  }
  return {id,site:'GG',stakes,datetime,table,hero,cards,board,seats,actions,decisions,status,flags:[...flags],raw,flopCount,aggressiveActionsPreflop,summary:{pot:expectedPot,rake,jackpot,other,winnings},runouts:variants};
}
function parseHands(input) {
  const normalized=format(String(input??''));
  if(!normalized)return {hands:[],errors:[{index:0,reason:'empty-file'}]};
  const blocks=normalized.split(/(?=^\uFEFF?Poker Hand #)/m).map(format).filter(Boolean);
  const hands=[],errors=[];
  for(const [i,raw] of blocks.entries()){
    try {hands.push(parseHand(raw))} catch(error){errors.push({index:i,reason:error.message})}
  }
  return {hands,errors};
}
function mergeHands(existing=[],incoming=[]) {
  const keyed=new Map(existing.map(h=>[`${h.site}:${h.id}`,h]));
  const conflicts=[];
  let added=0,duplicates=0;
  for(const h of incoming){
    const key=`${h.site}:${h.id}`, old=keyed.get(key);
    if(!old){keyed.set(key,h);added++}
    else if(old.raw===h.raw)duplicates++;
    else conflicts.push(h); // Keep current version stable. Caller can persist conflict candidates separately.
  }
  return {hands:[...keyed.values()],added,duplicates,conflicts};
}

return {cents,parseHands,mergeHands};
})();

const storageModule=(()=>{
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open('poker-study-lab-v1',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('local');
    r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
  });
}
async function load(key='state'){
  const db=await openDB();
  try{return await new Promise((res,rej)=>{const r=db.transaction('local').objectStore('local').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}finally{db.close();}
}
async function save(value,key='state'){
  const db=await openDB();
  try{await new Promise((res,rej)=>{const t=db.transaction('local','readwrite');t.objectStore('local').put(value,key);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}finally{db.close();}
}

return {load,save};
})();

const materialsModule=(()=>{
const materialLimit=8*1024*1024;
const dictionary=o=>o&&typeof o==='object'&&!Array.isArray(o)&&Object.getPrototypeOf(o)===Object.prototype;
const imageKey=/^(?:rfi-(?:utg|hj|co|btn|sb)|bb-btn-(?:2|2\.5|3)|gallery-(?:utg|hj|co|btn|sb|bb)-[a-z0-9]+)$/;

 if(!dictionary(x)||x.kind!=='decision-room-materials-v1'||!dictionary(x.charts)||!dictionary(x.pages))throw Error('這不是決策室教材包。請選「決策室-私人教材包.json」。');

 for(const [k,o] of ci){
  if(!imageKey.test(k)||!dictionary(o)||typeof o.label!=='string'||o.label.length>130||typeof o.anchor!=='string'||!/^(UTG|HJ|CO|BTN|SB|BB)![A-Z]{1,3}[1-9][0-9]{0,2}$/.test(o.anchor)||typeof o.data!=='string'||o.data.length>1800000||!/^iVBORw0KGgo[A-Za-z0-9+/]*={0,2}$/.test(o.data))throw Error('教材包內有無法讀取的圖表。');
  total+=o.data.length;charts[k]={label:o.label,anchor:o.anchor,data:o.data};
 }
 for(const [k,t] of pi){
  if(!/^[0-9]{1,2}$/.test(k)||+k<4||+k>86||typeof t!=='string'||t.length===0||t.length>9000)throw Error('教材包內有無法讀取的原書頁。');
  total+=t.length*3;pages[k]=t;
 }
 if(total>materialLimit)throw Error('教材包超出大小限制。');
 return {kind:x.kind,charts,pages};
}

return {materialLimit,validateMaterials};
})();

],'等比例是用相同比例乘當街當前底池，不是每一街下注相同銀碼。若雙方每街跟注，底池每街乘以 1+2s。若有 n 街、起始池 P、後手 S，將最後池寫成 P+2S，解出 s＝((1+2S/P)^(1/n)−1)/2；每街被跟時才剛好用完後手。','印刷頁 49 的 $5 底池例子，三街滿池被跟總投 $5+$15+$45=$65，而不是文字比較採用的 $100；本節用獨立自洽數字。理論模型不保證實際最優。',[
['池子遞推','底池 20，你下半池，對手跟。下一街底池及下一發半池是甚麼？',['30／15','40／20','40／10'],1,'兩人各投入 10，底池由 20 升至 40；下一發半池是 20。'],
['兩街計劃','轉牌底池 20，有效後手 30。如果兩街都用半池且對方都跟，河牌的半池能打光嗎？',['不能，只會投 20','不能，需要總共 50','可以，先投 10，再投 20'],2,'轉牌後池為 40，河牌半池為 20；你總投 30。'],
['跟注模型','為甚麼不能把各街的簡化 MDF 直接相乘，當成實際跟足所有下注的機率？',['到達後續街的範圍已改變，防守還包含加注，不一定等於跟足','每街同百分比','使用有效後手'],0,'先估每一街在已到達、面對該注碼的前提下實際跟注的機率，才可用條件機率沿線相乘；MDF 的繼續包含加注。'],
['遷移檢查','底池 8，有效後手 104。三街每次對手都跟你的一池下注，實際總共自己投多少？',['56，因為逐街下注額依次是 8、16、32','104+8','104，因為 8+24+72 剛好等於 104'],2,'被跟時 8→24→72，是實際三筆支出剛好相加為 104；換後手數字就沒有相同結論。']
]),
unit('c6-brick',6,'中立牌：不要只看平均權益',[52,54],'turn',[
'重建翻牌小注被跟後的雙方範圍','辨認頂端優勢與中段優勢可同時出現在兩方','選取合理強牌、聽牌及過牌保留'
],'雙方進轉牌的範圍不是重新發牌。中立牌沒大幅改寫頂端時，保留更多強組合的一方可能極化；部分強牌仍可留在過牌分支避免該線太弱。','參考圖 7.2–7.4。圖 7.2 屬教材的 NL50 休閒玩家、特定翻牌跟注及轉牌反加節點，不推成 Ted 的全池數據。',[
['範圍過濾','UTG 全範圍小注翻牌，BB 只用部分手牌跟。轉牌若屬中立牌，誰被這一項行動直接過濾得更多？',['BB，因為棄牌與加注的手牌不在跟注分支','UTG，因為任何下注都等於狹窄範圍','兩者都沒有被行動過濾'],0,'題設 UTG 使用所有翻前範圍下注，BB 只把跟注部分帶進這條線。'],
['中段和頂端','若 UTG 保留更多頂端組合，但 BB 跟注範圍的中段較紮實，何種配置較切合極化？',['把中間牌全部加到大注','大注由強牌加合適詐唬，中間牌多留過牌','只有抽牌下注，不放價值牌'],1,'大注用強牌與詐唬選擇性對付中段；把無需詐唬的中間牌也下大注，可能只被更強牌跟。'],
['覆蓋','你把所有頂對都下轉牌，沒有任何頂對選過牌。若河牌疊頂張，過牌分支可能有甚麼問題？',['過牌分支會自動增加頂對','所有弱牌會變強','缺少因頂張疊牌而升級的部分，容易暴露範圍上限'],2,'若完全沒有相關頂對，河牌疊頂張時少了升三條的一批強牌。'],
['遷移檢查','你在另一牌面的低轉牌想用中對下大注。估計較弱牌幾乎都棄、較強牌幾乎都跟。最合理的重查方向？',['先問有沒有更低攤牌價值或更好後續權益的詐唬候選，讓中對可過牌','中立牌必須所有中對開大注','中對下得越大越能拿較弱價值'],0,'在這假設下，中對取不到多少弱牌價值，亦難打走較好牌；「中立牌」不代表每手都下注。']
]),
unit('c6-overcard',6,'高轉牌：優勢增加不等於加大注碼',[54,56],'turn',[
'比較翻前和翻牌行動後仍保留的 Ax','從繼續範圍找價值對象','區分示例的小注基準和有條件的強牌大注'
],'同一張高轉牌可能使某方強牌更多，對方的最常跟注目標卻仍是次對。提高尺寸前先問這些較弱牌是否會放棄。','參考 Q♠T♥7♥ 後 A♦ 示例（圖 7.5–7.6）。不把該解當所有超牌轉牌的固定頻率。',[
['Ax 留存','UTG 用所有範圍小注翻牌，BB 曾在翻前 3-bet 部分強 Ax，翻牌亦棄沒有互動的 Ax。A 轉牌上先比較甚麼？',['只看 UTG 有位置','雙方在這條線仍然帶進來的 Ax 及其比重','只看誰最後加過注'],1,'未從翻前或翻牌路徑走到這裏的 Ax 不能算進現存範圍。'],
['較弱跟注目標','高轉牌到來後，你的第二對對對方仍有優勢，但對方較弱 Qx 遇大注會棄。甚麼更支持以小注找價值？',['小注可保留會跟的較弱 Qx','大注會讓所有 Ax 棄牌','見 A 就證明 Qx 已沒價值'],0,'小注可以留下較弱跟注者；若對手會頻密加注，還要重新查小注承受能力。'],
['阻擋比較','兩手都很強。甲阻擋對方最多的較弱跟注者；乙沒有阻擋那些手牌。只比較被跟機會，哪個較有理由測較大尺寸？',['一定是甲，因為有阻擋牌','兩者必定相同','乙，因為更多對手跟注手仍相容'],2,'價值下注通常想讓較弱跟注者留下；阻擋效果和牌力要合併考慮。'],
['遷移檢查','新情境高轉牌偏向進攻方，但防守方以大量較弱成牌跟小注、只用頂端跟超注。哪個判斷最實用？',['範圍有利仍應依牌力和較弱跟注者選尺寸，不強制整個範圍超注','只要範圍優勢就全範圍超注','把小注定為所有最強牌的唯一動作'],0,'優勢是誰能主動施壓的一項條件；每個尺寸會篩出不同對手範圍。']
]),
unit('c6-pair',6,'疊牌轉牌：跟注方何時躍升？',[56,59],'turn',[
'用翻牌跟注範圍推導疊牌後的三條密度','比較領打、平衡過牌與全過牌分支','檢查一對的價值尺寸與河牌覆盤'
],'若前街大量次對是跟注，次對疊牌會強化這邊部分組合。若跟注方不領打，這些強牌仍可能都留在過牌範圍。','參考圖 7.7–7.10，兩個過牌場景的使用前提不同；不抽取未逐格驗證的手牌頻率作答案。',[
['疊中張','Q-T-7 翻牌小注被跟，BB 多用 Tx 跟，且原本有較多 Tx。T 轉牌最直接改變甚麼？',['進攻方獨有所有三條','所有 BB 跟注手都變三條','BB 的部分中對變三條，頂端相對份量增加'],2,'原本的 Tx 在這張轉牌升級；提升幅度要看翻前和翻牌真的留下多少 Tx。'],
['領打可能性','若 BB 在該轉牌有更多三條與可施壓的抽牌，哪項是可檢驗的解釋？',['原跟注方領打有時可合理，因範圍相對強度已轉移','上一街不是進攻方就不容許領打','有三條就只可領打超注'],0,'領打是行動描述，不是錯誤標籤；尺寸和範圍是否合適須結合節點。'],
['範圍分流','在有領打的解法與「BB 全過牌」模型之間，後者的過牌範圍有何變化？',['多了平常會領打的手牌，不能當作自動示弱','必定不含三條','原先領打的手牌都被棄掉了'],0,'取消下注分支後，有關牌轉到過牌；進攻方的後續方案也要重算。'],
['遷移檢查','換一個牌面，對方前街大多把該對子用來加注而非跟注；你走的是被跟的線。現在該對子疊牌。這會怎樣影響你對他的三條估算？',['只因牌面疊對子就加到最大','調低相對估算，因較少相關對子沿這條線留下','跟注線與加注線的組合完全相同'],1,'相同的牌型變化可以導致不同的權益轉移，首先取決於所處節點。']
]),
unit('c6-multistreet',6,'從轉牌就安排河牌的條件',[59,61],'turn',[
'面對成順或成花牌先重數對手繼續範圍','比較 B–B–B 與 B–X–B 的前提','分清河牌棄牌假設與已驗證對手資料'
],'潮濕轉牌出現強牌並不代表所有薄價值消失。對手若轉牌願以弱抽牌或帶對聽牌跟注，既要計進當前價值，也要觀察未中時在河牌會怎樣應對。','印刷頁 59–61 的轉牌覆盤練習及圖 7.11。原件未公開逐條海龜計算，本課不假設特定 BBB/BXB EV。先用同一手牌換轉牌作假設，再以同桌型、同位置、同前序尺寸的 solver 比較；不以攤牌結果作答案。',[
['剩餘的價值','假設新成順轉牌後，對手面對指定尺寸會用 27 組較弱牌、16 組較強牌跟。哪個結論較合適？',['單就被跟部分仍有價值支持；整體還要問加注及河牌','出現順子，一對必須過牌','只數目前最強一組即可'],0,'牌面變濕會增添強牌，但不能忽略仍願意支付的弱牌。'],
['兩條線','B–B–B 與 B–X–B 最大的樣本差異在哪裏？',['第一條沒有轉牌下注','兩條對手到河牌的範圍必相同','第一條要被跟轉牌注才進河牌，第二條沒有這層過濾'],2,'不同轉牌行動使弱牌、聽牌與強牌留存比例不同，不能套相同河牌棄牌率。'],
['跟後再施壓','對手轉牌以大量中對和聽牌跟注，強手多加注，河牌對方少放棄這些中對。這支持甚麼？',['轉牌跟得多，代表河牌一定棄得多','河牌繼續詐唬的主要目標不容易放棄，需重新檢查整條線','轉牌有跟注即代表對手永遠沒有強牌'],1,'轉牌的鬆跟有時可送來河牌棄牌目標，但若這些手不棄，就不能把預期棄牌計成已存在。'],
['遷移檢查','改動一張河牌測同一手。新河牌讓對方一批轉牌跟注抽牌完成。你原本打算攻擊未中的抽牌，下一步是甚麼？',['維持固定連續下注','按新河牌重分未中與已中，重新看自己手牌阻擋與棄牌來源','用之前牌局的攤牌證明這次結果'],1,'只改新牌已足以改變目標範圍；應用同一前序重算，而非套用舊河牌答案。']
]),
unit('c7-nuts',7,'迷思一：大注較少被跟，未必較差',[62,64],'river',[
'比較堅果牌的額外價值而非被跟次數','理解誘導加注為何依賴對手傾向','不把堅果牌模型套到中等成牌'
],'若牌力不會輸，且只考慮跟注或棄牌，額外價值就是注碼 × 被跟率。若可能遇到加注、平局或較強牌，被跟率就不再足以比較。','印刷頁 62–64、圖 8.1–8.2 用來理解尺寸與誘導，不把單一示例手牌或玩家池整體加注率解讀為剛好適用自己的對局。',[
['付出多少','假設河牌你獨贏所有攤牌，對手只會跟或棄。下注 30 被跟 70%，下注 90 被跟 28%。哪個多取價值？',['30，因為 70% 較常被跟','90，因為平均多收 25.2，較 21 高','兩者一樣'],1,'基礎池是同一筆。用額外被支付的金額比較，90 × .28 = 25.2，30 × .70 = 21。'],
['誘導','小注強牌希望引到對方反加。甚麼資料會削弱這個前提？',['對手常以很弱牌反加','小注面對多種手牌會被跟','對方在此類河牌線面對小注幾乎只跟或棄'],2,'誘導要有實際可發生的加注；不能把理論範圍中的加注頻率當成已知。'],
['適用範圍','如果同樣的大注只會被更強手牌跟，為何不能直接用強牌的計算？',['被跟不等於贏，仍需重算各結果的收益及損失','中等牌只須知道下注大小','重要的是把對方跟進來，輸贏不用計'],0,'下注 × 被跟率只在指定的獨贏假設下等於額外收入。'],
['遷移檢查','底池 100。落在只跟或棄模型中，下注 25 被跟 80%，下注 100 被跟 19%。哪個尺寸較佳？',['100，因為強牌一定下大注','兩者一樣','25，因為 20 大於 19'],2,'大注不是絕對答案；20 與 19 取決於題設，不是見對方多棄就自動選小注。']
]),
unit('c7-river-call',7,'迷思二：跟轉牌不等於承諾跟河牌',[65,65],'river',[
'用河牌及下注尺寸更新跟注條件','辨認未中花作抓詐阻擋牌時的方向','把本人樣本、玩家池及推測分開'
],'跟注前一街是既成成本。進河牌須按當時的牌面、注碼、價值牌與詐唬重新評估，特別留意持牌究竟阻擋對方的價值還是詐唬。','印刷頁 65 的比率屬例示模型，不能把轉牌或河牌比率當作各牌面固定答案。原創題只用明示範圍與算式。',[
['決策重置','你上街用尚有改善機會的牌跟注；河牌未改善，對手改用超注。應優先比較甚麼？',['已付的上街注碼佔你原本多少籌碼','當前跟注門檻與此下注分支內的有效權益','看完結果再判斷上街是否應跟'],1,'已付金額是既成成本。新跟注由河牌下注分支及當前門檻決定。'],
['抓詐方向','兩手抓詐牌其他條件一樣。甲阻擋對方最常用來下注的未中花；乙不阻擋這類詐唬。哪一手有較好的抓詐方向？',['甲，任何阻擋都好','兩者無關','乙，因為不減少對方的詐唬組合'],2,'抓詐通常想保留對方詐唬、移除對方價值。仍須依題設定義哪些組合真的會下注。'],
['樣本','你只看過一手對方用未中花連打三街。合理可記錄甚麼？',['一次在該節點使用這種詐唬的觀察，不足以估整體頻率','對方每次都這樣打','整個級別都必定過度詐唬'],0,'一手攤牌是正例，卻沒有適當分母，也受能看到攤牌的選擇性影響。'],
['遷移檢查','河牌底池 60，對手下 60。假設對手有 18 個價值組合及 6 個詐唬組合，權重相同、無平分，你只贏詐唬。跟還是棄？',['跟，因為轉牌已跟','跟，因為有六組詐唬','棄，因為 25% 低於約 33.3%'],2,'6/24=25%；跟注成本 60，最終池 180，需 60/180。']
]),
unit('c7-depth',7,'迷思三：AK／QQ 要看位置、深度和賠率',[66,69],'preflop',[
'分開大小盲對抗與前位對抗','以有效籌碼及面對全下的價錢重算','以對手範圍和條件解釋棄牌，不只看牌名'
],'大小盲彼此前序範圍常比前位對抗寬。深籌碼也改變最終跟注成本及對手會用來全下的組合，不適合把 100 BB 的分支移到 150 BB。','參照印刷頁 66–69 圖 8.3–8.7。不同桌型、尺寸與抽水設定不可直接複製精確格值。',[
['位置','假設 100 BB 的大小盲戰 5-bet 範圍較寬，前位戰對手只用很強牌 5-bet。同一 QQ 為何不一定同答？',['不同分支的對手組合及跟注權益不同','QQ 的牌面點數變了','用同一手牌便不能更改決策'],0,'同手牌對寬及窄範圍的權益不同。尚要比較當前的跟注成本。'],
['有效深度','你有 180 BB，另一位有 120 BB，沒有其他玩家。在兩人這條行動線最多互相匹配幾多？',['180 BB','150 BB','120 BB'],2,'有效籌碼取較短的一方；多出的 60 BB 不會與此對手互相匹配。'],
['重新報價','前位遇全下，題設較深時需要補 95 BB，跟後池為 230 BB。跟注門檻約是？',['41.3%','58.7%','29.2%'],0,'95÷230≈41.3%；用最終池而非只拿剩餘籌碼作分母。'],
['遷移檢查','同一 AKo，跟後權益固定假設 39%。情境甲門檻 36%，情境乙門檻 42%，忽略其他成本。分別怎樣？',['甲跟；乙棄','都跟，因為 AKo','甲棄；乙跟'],0,'固定權益作對照，跨過門檻就會反轉；實際深度改變時還要更新對手範圍。']
]),

const courseModule=(()=>{
const {lessons: first}=course_firstModule;
const {lessons: last}=course_lastModule;
const {extras}=course_extrasModule;
const courseLessons=[...first,...last];
const courseExtras=extras;
const chapterTitles=['引言｜認識現代撲克','第 1 章｜翻前加注','第 2 章｜詐唬三原則','第 3 章｜範圍優勢','第 4 章｜最低防禦頻率與尺寸','第 5 章｜位置、反加與遊戲樹','第 6 章｜轉牌和極化','第 7 章｜釐清常見謬誤','第 8 章｜試探下注與數據'];
const COURSE_DAY=86400000;
function blankCourse(){
 return {lessonId:courseLessons[0]?.id??'',extraId:null,records:{},extras:{},active:null};
}
function lessonStatus(record,now=Date.now()){
 if(!record)return '未開始';
 if(record.due&&record.due<=now)return '到期複習';
 if(record.passedAt)return '已完成';
 if(record.checkHistory?.length)return '待補練';
 return '進行中';
}
function recommendedLesson(records,now=Date.now()){
 return courseLessons.find(l=>records[l.id]?.due>0&&records[l.id].due<=now)??courseLessons.find(l=>!records[l.id]?.passedAt)??null;
}
function masteryOf(answers,total){
 const score=answers.filter(a=>a.correct).length;
 return {score,total,pass:total>0&&answers.length===total&&score>=Math.ceil(.8*total)};
}
function finishRound(record,kind,answers,now=Date.now()){
 const r={studySeen:false,practiceHistory:[],checkHistory:[],passedAt:null,due:null,stage:0,...record};
 const score=masteryOf(answers,answers.length);
 const latest={at:now,score:score.score,total:answers.length,topics:[...new Set(answers.filter(a=>!a.correct).map(a=>a.topic))],allCorrect:score.pass};
 if(kind==='practice'){r.practiceHistory=[...r.practiceHistory,latest];return r;}
 r.checkHistory=[...r.checkHistory,latest];

 if(lessonId==='c7-river-call')return srp&&d.street==='river'&&d.toCall>0&&priorTurn.some(a=>a.position===d.position&&a.kind==='call');

 const cls={'c6-brick':'blank-like','c6-overcard':'over','c6-pair':'pair'}[lessonId];
 if(cls&&turnType()!==cls)return false;
 if(key==='preflop')return d.street==='preflop'&&d.aggressiveActionsPreflop<=1;

 if(key==='flop')return srp&&d.street==='flop';
 if(key==='raise')return srp&&d.street==='flop'&&d.toCall>0&&flop.some(a=>a.kind==='raise');
 if(key==='turn')return srp&&d.street==='turn'&&flop.some(a=>a.kind==='call')&&flop.some(a=>a.kind==='bet');
 if(key==='river')return srp&&d.street==='river';
 if(key==='probe'){

   if(lessonId==='c8-barrel')return srp&&d.position==='BB'&&d.street==='river'&&flopChecks&&turn.length===2&&turn[0].position==='BB'&&turn[0].kind==='bet'&&turn[1].kind==='call'&&!past.some(a=>a.street==='river'&&moneyActions.has(a.kind));

function questionHint(q,lesson){

function recommendedSkill(){

function makeMath(kind='mixed',difficulty='common'){
 const all=['call','bluff','mdf','equity','ev'];const rand=n=>Math.floor(Math.random()*n);
 const k=kind==='mixed'?all[rand(all.length)]:kind;
 if(k==='equity'){const n=40,w=rand(17)+3,t=rand(12);return {k,prompt:'對手有 '+n+' 個等權重組合：贏 '+w+' 組、平分 '+t+' 組、其餘落敗。你的權益是多少？',ans:100*equity(w,t,n),why:'贏的組合全計；平分只計一半。(' +w+' + '+t+' ÷ 2) ÷ '+n+'。'};}
 const p=difficulty==='cash'?500+rand(3000):[600,900,1200,1800,2400][rand(5)];
 const b=difficulty==='cash'?100+rand(3000):Math.round(p*[.25,1/3,.5,.75,1,1.25][rand(6)]);
 if(k==='ev'){const f=(25+rand(47))/100;return {k,prompt:'底池 '+money(p)+'；你下注 '+money(b)+' 純詐唬。對手以 '+percent(f)+' 棄牌。EV 是底池的多少 %？（可能為負數。）',ans:100*bluffEV(p,b,f)/p,why:'EV ＝ 棄牌率 × 底池 − 跟注率 × 下注額，再除以原底池。'};}
 return {k,prompt:'底池原有 '+money(p)+'，'+(k==='bluff'?'你下 '+money(b)+' 純詐唬，最少需要多少棄牌率？':'對手下 '+money(b)+'，'+(k==='call'?'跟注的損益分界是多少？':'簡化模型的最低防守頻率（MDF）是多少？')),ans:100*thresholds(p,b)[k],why:{call:'跟注額 ÷（原底池 + 對手下注 + 你的跟注）。',bluff:'下注額 ÷（原底池 + 下注額）。',mdf:'原底池 ÷（原底池 + 對手下注）；只適用題目的簡化模型。'}[k]};
}

const moveNames={fold:'棄牌',check:'過牌',call:'跟注',bet:'下注',raise:'加注',sb:'小盲',bb:'大盲',return:'退回未跟注金額'};
const streets={preflop:'翻前',flop:'翻牌',turn:'轉牌',river:'河牌'};
const hkey=h=>h.site+':'+h.id;
const verified=h=>h.status==='verified'&&h.decisions.some(d=>d.eligible);
const currentHand=()=>replay.synthetic??state.hands[replay.index];
const replayDecisions=h=>h?.status==='verified'?h.decisions.filter(d=>d.eligible&&(!filter.position||d.position===filter.position)&&(!filter.street||d.street===filter.street)&&(!replayScope||replay.synthetic||matchesCourseReplay(h,d,replayScope.key,replayScope.id))):[];
const currentDecision=h=>replayDecisions(h)[replay.decision];
function chooseReview(){
 const keys=filter.batch===''?null:new Set(state.batches[Number(filter.batch)]?.keys??[]);
 const eligibleHand=h=>(!filter.bb||h.stakes?.bb===Number(filter.bb))&&(!keys||keys.has(hkey(h)));
 const pool=state.hands.filter(eligibleHand);
 const match=(h,d)=>d.eligible&&(!filter.position||d.position===filter.position)&&(!filter.street||d.street===filter.street)&&(!replayScope||matchesCourseReplay(h,d,replayScope.key,replayScope.id));
 if(reviewMode==='all'){
   let items=pool.flatMap(h=>replayDecisions(h).map(d=>({hand:h,decision:d})));
   if(!items.length){inspection='所選範圍沒有符合結構的決定，請放寬條件。';reviewDetails=null;return false;}
   const matching=items;
   items=items.filter(({hand,decision})=>hand!==currentHand()||decision!==currentDecision(hand));
   const shown=items.length?items:matching;
   const item=shown[Math.floor(Math.random()*shown.length)];
   replay={index:state.hands.indexOf(item.hand),decision:replayDecisions(item.hand).indexOf(item.decision),result:null};
   reviewDetails=null;inspection='所有結構符合模式：有 '+matching.length+' 個決定，沒有套精選門檻。';return true;
 }
 const {items,stats}=rankReviewDecisions(pool,{match,lessonId:replayScope?.id,limit:32,maxPerFamily:1,excludeKeys:[...recentReview.keys()],excludeFamilies:[...recentReview.values()]});
 const item=items[0];
 if(!item){
   reviewDetails=null;
   inspection=stats.qualified?'目前篩選的精選場景已看過，去做模擬、改篩選，或開始新一輪。':'有 '+stats.matched+' 個結構符合的決定，沒有過精選門檻。可用模擬，或自選「所有結構符合」。';
   return false;
 }
 recentReview.set(item.key,item.family);
 if(recentReview.size>256)recentReview.delete(recentReview.keys().next().value);
 replay={index:state.hands.indexOf(item.hand),decision:replayDecisions(item.hand).indexOf(item.decision),result:null};
 reviewDetails={reasons:item.reasons};
 inspection='結構符合 '+stats.matched+' 個決定；門檻後 '+stats.qualified+' 個、分成 '+stats.uniqueFamilies+' 類。先挑未看過的類型。';
 return true;
}

function playingCards(cards,count){
 const suits={s:['♠','黑桃'],h:['♥','紅心'],d:['♦','方塊'],c:['♣','梅花']};
 return Array.from({length:count},(_,i)=>{
  const c=cards[i];if(!c)return '<span class="playing-card empty-card" aria-label="未揭曉">♢</span>';
  const [icon,suit]=suits[c.at(-1)]??['?', '未知花色'];
  const rank=c[0]==='T'?'10':esc(c[0]);
  return '<span class="playing-card '+('hd'.includes(c.at(-1))?'red-card':'ink-card')+'" role="img" aria-label="'+esc(suit)+rank+'"><b>'+rank+'</b><i aria-hidden="true">'+icon+'</i></span>';
 }).join('');
}

async function importFiles(list){

 if(working||!files.length){if(!files.length){status='請選擇 GG 的 TXT 牌譜。';if(view==='import')draw();}return;}
 if(files.reduce((s,f)=>s+f.size,0)>96*1024*1024){status='每批上限 96 MB，請分批匯入。';draw();return;}
 working=true;status='正在讀取 '+files.length+' 份 TXT…';draw();
 try{
  const out=await new Promise((resolve,reject)=>{
   const w=makeWorker();
   const fail=e=>{w.terminate();reject(e);};w.onerror=()=>fail(Error('未能啟動牌譜解析器。請經本機 HTTP 預覽開啟。'));
   w.onmessage=({data:d})=>{
    if(d.type==='progress'){status='已解析 '+d.done+'／'+d.total+' 份';const p=document.getElementById('import-status');if(p)p.textContent=status;}
    else if(d.type==='done'){w.terminate();resolve(d.out);}
    else fail(Error(d.error));
   };
   w.postMessage(files);
  });
  const incoming=out.flatMap(f=>f.hands);const result=mergeHands(state.hands,incoming);
  const n=state.batches.length+1;
  const batch={label:'第 '+n+' 批',at:Date.now(),files:out.map(f=>f.hash),keys:[...new Set(incoming.map(hkey))],added:result.added,duplicates:result.duplicates,conflicts:result.conflicts.length,conflictCandidates:result.conflicts,errors:out.reduce((s,f)=>s+f.errorCount,0)};
  state.hands=result.hands;state.batches.push(batch);await persist();
  status=batch.label+'完成：新增 '+batch.added+'、重複 '+batch.duplicates+'、衝突 '+batch.conflicts+'、無法匯入 '+batch.errors+'。';
 }catch(e){status='匯入未完成：'+e.message;}finally{working=false;if(view==='import')draw();}
}

   if(!state.exams[a]){
     if(a==='mock-b'&&!(state.exams['mock-a']?.finished&&Date.now()-state.exams['mock-a'].finished>=2*DAY))return;
     const items=bank.filter(q=>q.mode===a);
     const family=new Set(bank.filter(q=>q.mode!==a).map(q=>q.familyId));
     if(items.length!==40||items.some(x=>family.has(x.familyId))||new Set(items.map(x=>x.familyId)).size!==40||skillIDs.length!==8||skillIDs.some(s=>items.filter(x=>x.skill===s).length!==5)){
       lastNotice='此卷未通過題數或題族核對，暫不能開始。';draw();return;
     }
     state.exams[a]={items:structuredClone(items),index:0,attempts:[],opened:Date.now()};persist();
   }
   examKey=a;startAt=Date.now();draw('question-title');
 }else if(a==='backup'){
   const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
   const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='poker-private-backup.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
   lastNotice='已準備下載本機備份。';draw();
 }else if(a.startsWith('flag:')||a.startsWith('unflag:')){
   const [action,...id]=a.split(':');const key=id.join(':');const q=byId.get(key);if(q?.mode!=='practice')return;
   state.flags??={};if(action==='flag')state.flags[key]={at:Date.now(),version:q.version??1};else delete state.flags[key];lastNotice='已更新本機審核記錄。';persist();draw();
 }
});
main.addEventListener('keydown',e=>{
 if(view!=='odds'||e.key!=='Enter'||e.isComposing||e.repeat)return;
 if(liveMath?.result&&e.target.id==='feedback'){e.preventDefault();main.querySelector('[data-act="next-math"]')?.click();}
 else if(!liveMath?.result&&e.target.id==='math-field'){e.preventDefault();e.target.form.requestSubmit();}
});
main.addEventListener('change',async e=>{
 if(e.target.hasAttribute('data-materials-file')&&e.target.files?.[0]){
   if(changingMaterials)return;
   changingMaterials=true;
   const input=e.target,file=input.files[0],note=document.querySelector('#materials-status');
   input.disabled=true;if(note)note.textContent='正在核對教材包…';
   try{
     if(file.size>materialLimit)throw Error('教材包超出 8 MB。');
     let obj;try{obj=JSON.parse(await file.text());}catch{throw Error('檔案格式不正確；請選私人教材包 JSON。');}
     const pack=validateMaterials(obj);
     let persisted=false;
     try{await within(save(pack,'materials'),2200);persisted=true;}catch{}
     setLocalMaterials(pack,persisted);
     if(view==='materials')draw('materials-title');
   }catch(error){if(note?.isConnected)note.textContent=error.message+' 原有教材沒有被替換。';}
   finally{changingMaterials=false;if(input.isConnected){input.disabled=false;input.value='';}}
   return;
 }
 const key=e.target.dataset.coursePdf??e.target.dataset.referencePdf;
 if(Object.hasOwn(expectedPDF,key)&&e.target.files?.[0]){
   const file=e.target.files[0], token=Symbol(), inline=e.target.hasAttribute('data-reference-pdf');
   pdfPending[key]=token;
   const note=inline?e.target.closest('.ref-exact')?.querySelector('.pdf-hint'):null;
   if(note)note.textContent='正在核對 PDF 版本…';
   try{
     if(file.size>120*1024*1024||await file.slice(0,5).text()!=='%PDF-')throw Error('請選有效的 PDF（上限 120 MB）。');
     if(!globalThis.crypto?.subtle)throw Error('此瀏覽器未能核對版本。請按印刷頁碼手動查閱。');
     const hex=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer())),x=>x.toString(16).padStart(2,'0')).join('');
     if(hex!==expectedPDF[key])throw Error('這份 PDF 與已核對版本不同。未更換檔案；可按印刷頁碼手動查閱。');
     if(pdfPending[key]!==token)return;
     const old=coursePdfs[key]?.url;
     coursePdfs[key]={url:URL.createObjectURL(file),name:file.name};
     wirePdfBlocks(main,key,coursePdfs[key]);
     if(old)URL.revokeObjectURL(old);
     if(!inline&&view==='course'&&e.target.isConnected){lastNotice='已核對教材版本，可開啟本課頁碼。';draw();}
   }catch(err){
     if(pdfPending[key]!==token)return;
     if(note?.isConnected)note.textContent=err.message;
     else if(!inline&&view==='course'&&e.target.isConnected){lastNotice=err.message;draw();}
   }
   return;
 }

 if(e.target.id==='files')return importFiles(e.target.files);
 if(e.target.id==='restore'&&e.target.files?.[0]&&!working){
   const file=e.target.files[0];working=true;restoring=true;
   lastNotice='正在檢查備份，還未取代任何資料。';if(view==='progress')draw('restore-status');
   try{
     if(file.size>256*1024*1024)throw Error('備份超出 256 MB');
     const content=await file.text();
     let parsed;try{parsed=JSON.parse(content);}catch{throw Error('檔案不是有效的 JSON 備份');}
     const restored=validateBackup(parsed);
     restored.course=validateCourse(restored.course);
     if(!confirm(restoreSummary(state,restored))){lastNotice='已取消還原，目前資料不變。';return;}
     await writeQueue.catch(()=>{});
     try{await save(restored);}catch{throw Error('瀏覽器未能儲存備份');}
     state=restored;
     examKey=null;liveMath=null;replayScope=null;recentReview.clear();reviewDetails=null;
     replay={index:null,decision:0,result:null};filter={batch:'',bb:'',position:'',street:''};
     inspection='';status='';reviewMode='curated';persistError='';lastNotice='已還原本機備份。';
   }catch(err){lastNotice='還原失敗：'+err.message+'。目前資料未被取代。';}
   finally{working=false;restoring=false;if(view==='progress')draw('restore-status');}
 }
});
main.addEventListener('dragover',e=>{if(view==='import'&&e.dataTransfer.types.includes('Files')){e.preventDefault();document.querySelector('#drop')?.classList.add('drag');}});
main.addEventListener('dragleave',()=>document.querySelector('#drop')?.classList.remove('drag'));
main.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();if(view==='import')importFiles(e.dataTransfer.files);}});
addEventListener('hashchange',route);
try{
 const [book,progress]=await within(Promise.all([within(load('materials'),1200).catch(()=>null),load()]),2200);
 state=progress??makeState();if(book){try{setLocalMaterials(validateMaterials(book),true);}catch{}}
}catch(e){
 state=makeState();storageUnavailable=true;
 persistError='暫時讀不到這個瀏覽器的進度。你可以練習，但請先備份再關閉網頁。';
}
try{state.course=validateCourse(state.course);}catch(e){state.course=blankCourse();persistError='未能讀取舊課程進度。其他本機資料已保留。';}
route();
</script>
</body></html>
